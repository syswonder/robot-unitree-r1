[contract]
id = "robonix/primitive/arm/move_joints"
version = "1"
kind = "primitive"
idl = "r1_arm/srv/MoveJoints.srv"
description = "In FSM 811, moves several named arm joints together, including both arms in one call. joint_names, target_rad and speed_rad_s are equal-length arrays: URDF names, absolute targets and speed limits, in rad and rad/s. All joints share one time base and one control session. The result lists measured position, error and actual change per joint."

[mode]
type = "rpc"
