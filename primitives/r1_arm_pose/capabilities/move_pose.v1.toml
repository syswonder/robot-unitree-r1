[contract]
id = "robonix/primitive/arm/move_pose"
version = "1"
kind = "primitive"
idl = "r1_arm_pose/srv/MovePose.srv"
description = "In official FSM 811 (walk-run), moves this provider's wrist to an absolute pose in waist_yaw_link. x, y, z are metres. qx, qy, qz, qw is a normalized quaternion. speed_rad_s is the per-joint speed limit. A full pose the five-degree-of-freedom arm cannot meet is an error. Motion is joint interpolation, so the tip path is not straight. Control is released afterwards."

[mode]
type = "rpc"
