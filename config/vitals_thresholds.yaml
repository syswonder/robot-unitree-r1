# R1-specific Vitals threshold overrides.
#
# The IMU reports 79-82 C in normal operation. The upstream example rule used
# warn_above 80, which produced a repeating "body/body/imu temperature"
# warning and then recovered on every small fluctuation. Keep the generic
# sensor threshold, but give the R1 board sensors more margin.
robot_model: "unitree_r1"

rules:
  - id: "joint_motor_temp"
    selector:
      kind: "JOINT"
      signal: "motor_temp"
    warn_above: 60.0
    error_above: 75.0
    unit: "degC"

  - id: "joint_driver_temp"
    selector:
      kind: "JOINT"
      signal: "driver_temp"
    warn_above: 70.0
    error_above: 85.0
    unit: "degC"

  - id: "battery_soc"
    selector:
      kind: "BATTERY"
      signal: "soc_percent"
    warn_below: 20.0
    error_below: 8.0
    unit: "percent"

  - id: "battery_voltage"
    selector:
      kind: "BATTERY"
      signal: "voltage"
    warn_below: 22.0
    error_below: 19.0
    unit: "V"

  - id: "board_temperature"
    selector:
      kind: "SENSOR"
      signal: "temperature"
    warn_above: 85.0
    error_above: 95.0
    unit: "degC"
