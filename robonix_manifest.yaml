# Unitree R1 EDU 整机部署。行走和双臂使用官方运控；机器人网络接口为 eth10。
# 这是软件包目录索引的根清单，目录名为 robonix.robot.unitree.r1。
# 路径依赖 ROBONIX_DEPLOY_DIR，由 scripts/env.sh 在启动前导出。
manifestVersion: 1
name: r1-native

catalog:
  name: robonix.robot.unitree.r1
  version: 0.1.0
  description: "Unitree R1 EDU 本机部署：本体描述、状态与感知，以及基于官方运控的行走和双臂控制。"
  license: Apache-2.0 AND BSD-3-Clause
  tags: [robot, deploy, unitree, r1, humanoid]
  maintainers:
    - 张振宇 <768726812@qq.com>

env:
  LOG: "INFO"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROBONIX_LIAISON_VOICE_SAVE_DIR: ${ROBONIX_DEPLOY_DIR}/logs/voice

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info
  soma:
    listen: 127.0.0.1:50091
    provider_id: soma
    robot_yaml: soma.yaml
    log: info
  vitals:
    listen: 127.0.0.1:50093
    log: info
    thresholds_path: ${ROBONIX_DEPLOY_DIR}/config/vitals_thresholds.yaml

primitive:
  - name: r1_chassis
    path: ./primitives/r1_chassis
    config:
      network_interface: eth10
      linear_speed_m_s: 0.3
      backward_speed_m_s: 0.4
      angular_speed_rad_s: 0.3
      max_linear_speed_m_s: 0.4
      max_angular_speed_rad_s: 0.5
      default_duration_s: 5.0
      max_duration_s: 10.0
      command_timeout_s: 0.3
  - name: audio_client_bridge
    path: ./primitives/audio_client_bridge
    config:
      transport: reverse
      listen_host: 127.0.0.1
      listen_port: 60002
  - name: r1_left_arm
    path: ./primitives/r1_arm_pose
    config:
      side: left
      joint_provider_id: r1_arm
      speed_rad_s: 0.05
  - name: r1_right_arm
    path: ./primitives/r1_arm_pose
    config:
      side: right
      joint_provider_id: r1_arm
      speed_rad_s: 0.05
  - name: r1_imu
    path: ./primitives/r1_imu
    config:
      network_interface: eth10
      frame_id: imu_in_pelvis_link
      stale_after_s: 2.0
  - name: r1_arm
    path: ./primitives/r1_arm
    config:
      network_interface: eth10
      max_acceleration_rad_s2: 0.5
      max_jerk_rad_s3: 2.0
  - name: r1_state
    path: ./primitives/r1_state
    config:
      network_interface: eth10
      stale_after_s: 2.0
  - name: r1_health
    path: ./primitives/r1_health
    config:
      network_interface: eth10
      interval_s: 0.5
      stale_after_s: 2.0
  - name: r1_camera
    path: ./primitives/r1_camera
    config:
      # video_hub is disabled so the stereo service can run; use the stereo
      # module's 1280x720 H.264 image stream instead of videohub API 1001.
      source: stereo_udp
      udp_port: 5001
      rotate: clockwise
      frame_id: r1_front_camera_optical_frame
      stale_after_s: 2.0
  - name: r1_depth
    path: ./primitives/r1_depth
    config:
      device: /dev/video-dep
      width: 544
      height: 448
      fps: 10.0
      frame_id: r1_depth_camera_optical_frame
      byte_order: big
      stale_after_s: 2.0
      min_depth_mm: 200.0
      max_depth_mm: 10000.0
  - name: r1_audio
    path: ./primitives/r1_audio
    config:
      network_interface: eth10
      multicast_group: 239.168.123.161
      port: 5555
      sample_rate_hz: 16000
      chunk_bytes: 32000
      stale_after_s: 3.0

service:
  - name: visual_action_decider
    path: ./services/visual_action_decider
    config:
      decider_url: http://127.0.0.1:18080
      encoder_url: http://127.0.0.1:18081
      model_revision: 585473dec4fa93f0325c2bf02dda7273b61f44c1
      data_dir: ${ROBONIX_DEPLOY_DIR}/.work/visual-action
      pipeline_timeout_s: 60
      motion_enabled: false
      turning_verified: false
  - name: speech
    path: ./services/r1_speech
    config:
      speech_backend: custom
      speech_asr_backend_class: r1_speech.backends:SherpaASRBackend
      speech_asr_stream_backend_class: r1_speech.backends:SherpaASRBackend
      speech_tts_backend_class: r1_speech.backends:SherpaTTSBackend
      default_speaker_provider_id: r1_audio
      wake_word_model_dir: ${ROBONIX_DEPLOY_DIR}/services/r1_speech/rbnx-build/models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
      wake_words: [罗伯特]
skill: []
