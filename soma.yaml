# Unitree R1 EDU body description for Soma.
#
# Source model: unitreerobotics/unitree_ros, robots/r1_description/R1.urdf
# Pinned commit: 5994d4faef0a9cadd3287f8de0199a67eeb2a259 (2026-09-30)
# License: BSD-3-Clause, see urdf/LICENSE.unitree.
#
# Body description and primitive capability links. The deployment manifest starts the primitives.
# Both arms move in official sport mode 811.

urdf:
  path: ./urdf/R1.urdf
  root_link: base_link
  model_name: unitree_r1

robot:
  id: unitree_r1_01
  display_name: "Unitree R1 (EDU)"
  family: humanoid
  root_part: body

  # Computed from the official URDF's zero-pose visual meshes (0.3691 x
  # 0.3625 x 1.2302 m). Verify against the R1 datasheet and the physical robot
  # before using these values outside rendering.
  dimensions:
    length_m: 0.369
    width_m: 0.363
    height_m: 1.230

  # Conservative static support rectangle from the two foot meshes at zero
  # pose, expanded by about 2 cm. This is NOT the dynamic walking envelope and
  # must be re-measured before navigation/motion is enabled.
  footprint:
    base_frame: base_link
    points:
      - [0.16, 0.15]
      - [0.16, -0.15]
      - [-0.08, -0.15]
      - [-0.08, 0.15]

  # Sum of all link masses in the official URDF.
  mass_kg: 28.84

  # Provisional conservative passage width; confirm on the physical robot.
  passable_door_width_m: 0.60

  exports:
    - provider_id: r1_chassis
      capabilities:
        - { path: robonix/primitive/chassis/move, description: "Timed walk through official SetVelocity. Distance and angle are open-loop approximations." }
        - { path: robonix/primitive/chassis/twist_in, description: "Standard Twist velocity input. Non-zero walking requires FSM 811." }

    - provider_id: r1_state
      capabilities:
        - { path: robonix/primitive/r1/get_state, description: "Read R1 FSM, IMU, BMS and motor state as JSON." }

    - provider_id: r1_health
      capabilities:
        - { path: robonix/primitive/health/state, description: "Read R1 FSM, BMS, IMU validity and joint health." }
        - { path: robonix/primitive/health/stream, description: "Stream R1 health state into Soma and Vitals." }

  components:
    - id: body
      type: body_part
      urdf_link: pelvis_link
      exports: []
      components:
        - id: imu
          type: imu
          urdf_link: imu_in_pelvis_link
          exports:
            - provider_id: r1_imu
              capabilities:
                - { path: robonix/primitive/imu/imu, description: "R1 IMU from rt/lowstate." }

        # No URDF frame for the R1 front video service yet; add one only after
        # the camera extrinsic has been measured. The component is kept as a
        # logical placeholder for the future camera primitive.
        - id: front_camera
          type: rgb_camera
          exports:
            - provider_id: r1_camera
              capabilities:
                - { path: robonix/primitive/camera/snapshot, description: "Capture one RGB frame from the R1 front camera." }
                - { path: robonix/primitive/camera/rgb, description: "Standard rgb8 image stream. The stamp is the host receive time." }
                - { path: robonix/primitive/camera/intrinsics, description: "Publishes CameraInfo. K is zero when the camera is uncalibrated." }
                - { path: robonix/primitive/camera/extrinsics, description: "Static mount extrinsic. Without a measured file the interface reports a failed precondition." }

        - id: depth_camera
          type: depth_camera
          exports:
            - provider_id: r1_depth
              capabilities:
                - { path: robonix/primitive/camera/depth, description: "32FC1 metric depth stream in metres. RGB registration is not done." }
                - { path: robonix/primitive/camera/depth_snapshot, description: "Grayscale depth snapshot for display." }
                - { path: robonix/primitive/camera/intrinsics, description: "CameraInfo for the depth image grid. K is zero when uncalibrated." }
                - { path: robonix/primitive/camera/extrinsics, description: "Measured mount extrinsic of the depth optical frame. It needs its own file." }

        - id: audio
          type: audio_io
          exports:
            - provider_id: r1_audio
              capabilities:
                - { path: robonix/primitive/audio/mic, description: "Official head-microphone PCM stream." }
                - { path: robonix/primitive/audio/speaker, description: "Plays PCM through the official voice service." }

        - id: battery
          type: battery
          exports: []

        - id: left_leg
          type: leg
          urdf_link: left_hip_pitch_link
          exports: []
          components:
            - { id: left_hip_pitch, type: joint, urdf_joint: left_hip_pitch_joint, exports: [] }
            - { id: left_hip_roll, type: joint, urdf_joint: left_hip_roll_joint, exports: [] }
            - { id: left_hip_yaw, type: joint, urdf_joint: left_hip_yaw_joint, exports: [] }
            - { id: left_knee, type: joint, urdf_joint: left_knee_joint, exports: [] }
            - { id: left_ankle_pitch, type: joint, urdf_joint: left_ankle_pitch_joint, exports: [] }
            - { id: left_ankle_roll, type: joint, urdf_joint: left_ankle_roll_joint, exports: [] }

        - id: right_leg
          type: leg
          urdf_link: right_hip_pitch_link
          exports: []
          components:
            - { id: right_hip_pitch, type: joint, urdf_joint: right_hip_pitch_joint, exports: [] }
            - { id: right_hip_roll, type: joint, urdf_joint: right_hip_roll_joint, exports: [] }
            - { id: right_hip_yaw, type: joint, urdf_joint: right_hip_yaw_joint, exports: [] }
            - { id: right_knee, type: joint, urdf_joint: right_knee_joint, exports: [] }
            - { id: right_ankle_pitch, type: joint, urdf_joint: right_ankle_pitch_joint, exports: [] }
            - { id: right_ankle_roll, type: joint, urdf_joint: right_ankle_roll_joint, exports: [] }

        - id: waist
          type: body_part
          urdf_link: waist_roll_link
          exports: []
          components:
            - { id: waist_roll, type: joint, urdf_joint: waist_roll_joint, exports: [] }
            - { id: waist_yaw, type: joint, urdf_joint: waist_yaw_joint, exports: [] }

            - id: left_arm
              type: arm
              urdf_link: left_shoulder_pitch_link
              exports:
                - provider_id: r1_left_arm
                  capabilities:
                    - { path: robonix/primitive/arm/end_pose, description: "Standard left-wrist pose relative to waist_yaw_link." }
                    - { path: robonix/primitive/arm/pos_command, description: "Full left-wrist pose goal, executed as synchronized joint interpolation." }
                    - { path: robonix/primitive/arm/get_end_pose, description: "Reads the left-wrist position, orientation and frame name." }
                    - { path: robonix/primitive/arm/move_pose, description: "Commands the left-wrist pose through URDF inverse kinematics." }
                - provider_id: r1_arm
                  capabilities:
                    - { path: robonix/primitive/arm/joint_states, description: "Reads both arms' joint feedback." }
                    - { path: robonix/primitive/arm/joint_command, description: "Runs named joint position commands in FSM 811." }
                    - { path: robonix/primitive/arm/get_joint_states, description: "Reads both arms' angles, limits and speed limits." }
                    - { path: robonix/primitive/arm/move_joint, description: "Runs one joint-angle command by URDF name in FSM 811." }
                    - { path: robonix/primitive/arm/move_joints, description: "Runs several joint targets together, including both arms, on one shared time base." }
              components:
                - { id: left_shoulder_pitch, type: joint, urdf_joint: left_shoulder_pitch_joint, exports: [] }
                - { id: left_shoulder_roll, type: joint, urdf_joint: left_shoulder_roll_joint, exports: [] }
                - { id: left_shoulder_yaw, type: joint, urdf_joint: left_shoulder_yaw_joint, exports: [] }
                - { id: left_elbow, type: joint, urdf_joint: left_elbow_joint, exports: [] }
                - { id: left_wrist_roll, type: joint, urdf_joint: left_wrist_roll_joint, exports: [] }

            - id: right_arm
              type: arm
              urdf_link: right_shoulder_pitch_link
              exports:
                - provider_id: r1_right_arm
                  capabilities:
                    - { path: robonix/primitive/arm/end_pose, description: "Standard right-wrist pose relative to waist_yaw_link." }
                    - { path: robonix/primitive/arm/pos_command, description: "Full right-wrist pose goal, executed as synchronized joint interpolation." }
                    - { path: robonix/primitive/arm/get_end_pose, description: "Reads the right-wrist position, orientation and frame name." }
                    - { path: robonix/primitive/arm/move_pose, description: "Commands the right-wrist pose through URDF inverse kinematics." }
                - provider_id: r1_arm
                  capabilities:
                    - { path: robonix/primitive/arm/joint_states, description: "Reads both arms' joint feedback." }
                    - { path: robonix/primitive/arm/joint_command, description: "Runs named joint position commands in FSM 811." }
                    - { path: robonix/primitive/arm/get_joint_states, description: "Reads both arms' angles, limits and speed limits." }
                    - { path: robonix/primitive/arm/move_joint, description: "Runs one joint-angle command by URDF name in FSM 811." }
                    - { path: robonix/primitive/arm/move_joints, description: "Runs several joint targets together, including both arms, on one shared time base." }
              components:
                - { id: right_shoulder_pitch, type: joint, urdf_joint: right_shoulder_pitch_joint, exports: [] }
                - { id: right_shoulder_roll, type: joint, urdf_joint: right_shoulder_roll_joint, exports: [] }
                - { id: right_shoulder_yaw, type: joint, urdf_joint: right_shoulder_yaw_joint, exports: [] }
                - { id: right_elbow, type: joint, urdf_joint: right_elbow_joint, exports: [] }
                - { id: right_wrist_roll, type: joint, urdf_joint: right_wrist_roll_joint, exports: [] }

            - id: head
              type: body_part
              urdf_link: head_pitch_link
              exports: []
              components:
                - { id: head_pitch, type: joint, urdf_joint: head_pitch_joint, exports: [] }
                - { id: head_yaw, type: joint, urdf_joint: head_yaw_joint, exports: [] }

description:
  summary: "Unitree R1 EDU body, health, perception, official high-level walking, and dual-arm joint and wrist-pose control."
  can_do:
    - "Serves chassis/move over MCP and gRPC, and chassis/twist_in, through official SetVelocity. Non-zero speed requires FSM 811. Forward 0.3 m/s and backward -0.4 m/s for five seconds have been checked."
    - "Runs named dual-arm joint angles in FSM 811 through the standard interface and MCP tools. move_joints can move several joints in one call."
    - "Computes both wrist poses from the official URDF, solves a full pose goal, and runs synchronized joint interpolation."
    - "Serve the official R1 URDF and the semantic body/component tree."
    - "Expose read-only state, health and stereo RGB/depth snapshot providers."
    - "Show battery SOC/voltage/temperature, IMU temperature and joint telemetry in Vitals."
    - "Return a 544x448 depth PNG from the binocular depth camera."
  cannot_do:
    - "Does not command leg joints or body posture directly, and does not plan arm collisions or a straight tip path."
    - "Publish a verified TF tree; no robot-description provider is included yet."
    - "Provide the official SLAM service; it requires R1-EDU + Mid360 LiDAR and unitree_slam is not installed."
    - "Provide a metric scene map; no scene/mapping service is deployed."
    - "Measured camera calibration, RGB-D registration and the camera mount TF are not done. Uncalibrated CameraInfo has K equal to zero."
  notes:
    - "Walking direction is a signed speed. The entry checks the live FSM, configuration and motion feedback for each request."
    - "Lateral motion, rotation and measured walking distance still need on-robot acceptance."
    - "URDF source: unitreerobotics/unitree_ros robots/r1_description at commit 5994d4faef0a9cadd3287f8de0199a67eeb2a259."
    - "A zero-offset base_link wrapper was added; pelvis_link remains the physical root."
    - "Dimensions and mass are derived from the URDF; footprint is a provisional static support rectangle."
    - "The 26 revolute joints match the R1 EDU body; the R1 Air 20-DOF model is not used."
    - "The standard r1_imu interface is connected. Camera calibration and the mount transform need measured device data."
    - "r1_camera uses the stereo UDP stream because video_hub is disabled for the stereo/depth service."
